      <stop offset="0%" stop-color="#0e7490" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#082f49" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#030407" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arcA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#67e8f9" stop-opacity="0.95"/>
